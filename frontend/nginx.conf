server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 정적 자산은 파일명으로 직접 서빙. 지금 배포에 없으면 지난 배포 보관본에서 낸다
    # (열어 둔 옛 화면이 조각을 못 찾아 흰 화면이 되는 것을 막는다).
    location /assets/ {
        try_files $uri @kept;
    }
    location @kept {
        root /srv/keep;
        try_files $uri =404;
    }

    # 서비스 워커는 캐시 금지(업데이트 즉시 반영)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # 웹 매니페스트는 올바른 MIME 로(PWA 설치 인식)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # SPA 라우팅: 정적 파일 없으면 index.html 로 폴백
    # ($uri/ 폴백을 두지 않음 — /assets 같은 라우트가 빌드 디렉터리로 잡혀 403 나는 것 방지)
    location / {
        try_files $uri /index.html;
    }
}
