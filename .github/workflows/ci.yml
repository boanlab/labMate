name: CI

# 코드를 건드리는 모든 push/PR 에서 돈다. 잡을 표면(백엔드·프론트·컴포즈·이미지)
# 별로 쪼개 두었기 때문에, 빨간 잡 이름만 봐도 어디가 깨졌는지 알 수 있다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PR 에 새 커밋이 올라오면 진행 중이던 실행은 이미 무의미하므로 취소한다.
# main 은 예외 — 어떤 커밋이 초록이었는지 기록이 남아야 한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend · lint, import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Dockerfile 의 python:3.12-slim 과 같은 버전으로 맞춘다.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/services/*/requirements.txt

      - name: Install
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install ./backend/libs/common
          for s in members projects funds attendance boards resource; do
            pip install -r "backend/services/$s/requirements.txt"
          done
          # 린터 버전은 고정한다 — 새 규칙이 들어와서 CI 가 혼자 빨개지는 일이 없도록.
          pip install ruff==0.16.3

      - name: Lint
        working-directory: backend
        # 규칙은 backend/ruff.toml 에 있다(로컬에서도 `ruff check` 하나로 동일하게 돈다).
        run: ruff check .

      - name: Import smoke
        # 아직 테스트가 없으므로, 여섯 서비스가 임포트되는지가 최소 안전망이다.
        # 문법 오류·깨진 임포트·라우터 등록 실패를 잡는다. DB 연결은 lifespan
        # 에서만 일어나므로 임포트만으로는 postgres/redis 가 필요 없다.
        run: |
          set -euo pipefail
          for s in members projects funds attendance boards resource; do
            (cd "backend/services/$s" && python -c "import app.main")
            echo "  $s ok"
          done

  frontend:
    name: frontend · typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # frontend/Dockerfile 의 node:20-alpine 과 같은 메이저.
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # `install` 이 아니라 `ci` — 락파일이 계약이고, 매번 다른 의존성 트리가
        # 조용히 풀리는 빌드는 검증한 빌드가 아니다.
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        # `npm run build` 는 `tsc -b && vite build` — 타입 오류는 이미지 빌드
        # 단계까지 가지 않고 여기서 걸린다.
        run: npm run build

  compose:
    name: compose · validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 컨테이너를 띄우지 않고 보간·스키마 오류만 잡는다. JWT_SECRET 과
      # POSTGRES_PASSWORD 는 `:?` 로 필수 선언되어 있어 값이 있어야 렌더링된다.
      - name: Validate compose files
        env:
          JWT_SECRET: ci-placeholder-not-a-secret
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.override.yml config -q

  shell:
    name: shell · shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # postgres init 스크립트는 컨테이너 첫 기동 때 한 번만 도는 코드라
      # 평소에 아무도 실행해 보지 않는다. 정적 검사가 유일한 게이트다.
      # (러너에 shellcheck 가 기본 설치되어 있다)
      - name: ShellCheck
        run: shellcheck deploy/postgres/init/*.sh

  image-changes:
    name: image · detect changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # 전체 히스토리 — 비교 기준 커밋이 shallow clone 에는 없다.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to build
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail

          SERVICES="members projects funds attendance boards resource"
          ALL="$SERVICES frontend"
          selected=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "수동 실행 — 전체 이미지 빌드"
            selected="$ALL"
          # 비교 기준이 없는 경우: 첫 커밋, 새 브랜치, 이전 tip 을 지운 force push.
          elif [ -z "${BASE:-}" ] \
               || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "비교 기준 커밋 없음 — 전체 이미지 빌드"
            selected="$ALL"
          else
            changed=$(git diff --name-only "$BASE" "$HEAD")
            echo "변경된 파일:"
            while IFS= read -r f; do echo "  $f"; done <<< "$changed"

            # 공통 라이브러리는 여섯 서비스 이미지에 모두 들어가고,
            # 이 워크플로 자체가 바뀌면 판정 로직을 믿을 수 없다 → 전체 빌드.
            if echo "$changed" | grep -qE '^(backend/libs/|\.github/workflows/ci\.yml$)'; then
              echo "공통 라이브러리/워크플로 변경 — 전체 이미지 빌드"
              selected="$ALL"
            else
              for s in $SERVICES; do
                if echo "$changed" | grep -q "^backend/services/$s/"; then
                  selected="$selected $s"
                fi
              done
              if echo "$changed" | grep -q '^frontend/'; then
                selected="$selected frontend"
              fi
            fi
          fi

          json=""
          for n in $selected; do
            case "$n" in
              frontend) e='{"name":"frontend","context":"frontend","file":"frontend/Dockerfile"}' ;;
              *)        e="{\"name\":\"$n\",\"context\":\"backend\",\"file\":\"backend/services/$n/Dockerfile\"}" ;;
            esac
            json="$json${json:+,}$e"
          done

          if [ -z "$json" ]; then
            echo "이미지 소스 변경 없음 — 빌드할 것 없음"
            { echo 'matrix={"include":[]}'; echo 'any=false'; } >> "$GITHUB_OUTPUT"
          else
            echo "빌드 대상:$selected"
            { echo "matrix={\"include\":[$json]}"; echo 'any=true'; } >> "$GITHUB_OUTPUT"
          fi

  images:
    name: image · build ${{ matrix.name }}
    needs: image-changes
    if: needs.image-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 빌드만 한다. 레지스트리 푸시는 `make release` 로 사람이 하는 일이고,
      # 포크에서 온 PR 이 이미지를 밀어 넣을 수 있으면 안 되므로 이 워크플로에는
      # 레지스트리 자격증명 자체를 두지 않는다.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
