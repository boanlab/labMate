# 백엔드 린트 설정 — CI(.github/workflows/ci.yml)와 로컬에서 같은 규칙을 쓴다.
#
# 지금은 "실제로 깨지는 것"만 막는다: E9(문법/들여쓰기 오류)와 F(pyflakes —
# 정의되지 않은 이름, 미사용 임포트, 중복 정의 등). 스타일 규칙(E7 세미콜론,
# I001 임포트 정렬 등)은 기존 코드에 수백 건이 걸려 있어서 켜면 전부 빨간불이
# 되므로 제외했다. 정리되는 대로 select 에 하나씩 추가하면 된다.
[lint]
select = ["E9", "F"]

[lint.per-file-ignores]
# alembic 템플릿은 마이그레이션 생성용 스켈레톤이라 미사용 임포트가 정상이다.
"*/alembic/env.py" = ["F401"]
