# LabMate API 게이트웨이 — /api/<service>/* 를 각 서비스로 라우팅하고 프론트를 서빙한다.

# 첨부를 브라우저에서 열어도 되는 형식과, 반드시 내려받게 할 형식을 가른다.
# 첨부는 앱과 같은 출처에서 나가므로, 열리는 형식을 좁게 잡지 않으면
# 올린 파일이 곧 같은 출처의 페이지가 된다(저장형 XSS).
map $uri $lm_disposition {
    default                                   "attachment";
    ~*\.(png|jpe?g|gif|webp|bmp|pdf)$         "inline";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;   # 자료실 파일 업로드 여유

    # ── 인증 서비스 ──
    location /api/members/ {
        proxy_pass         http://members-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 연구 서비스 ──
    location /api/projects/ {
        proxy_pass         http://projects-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/funds/ {
        proxy_pass         http://funds-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/attendance/ {
        proxy_pass         http://attendance-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/boards/ {
        proxy_pass         http://boards-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/resource/ {
        proxy_pass         http://resource-service:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── 첨부 다운로드 인증(내부 전용) ──
    # 로그인 시 발급되는 httpOnly 쿠키만 확인한다. 스크립트가 읽을 수 없으므로
    # 설령 XSS 가 나더라도 이 쿠키로 API 를 부를 수는 없다(다운로드 전용 토큰).
    location = /_uploads_auth {
        internal;
        proxy_pass              http://members-service:8000/uploads-auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # ── 첨부 정적 서빙(읽기 전용, 로그인 필요) ──
    # 예외는 두지 않는다. 로그인 전에 보여야 하는 로고는 파일이 아니라
    # 설정값(data URI)으로 들고 있어서, 여기에 무인증 구멍을 낼 이유가 없다.
    location /uploads/ {
        alias /srv/uploads/;
        auth_request /_uploads_auth;
        # no-cache = "캐시는 하되 쓸 때마다 물어본다". 공용 PC 에서 로그아웃한 뒤에도
        # 캐시에 남은 첨부가 그대로 열리는 것을 막는다(대개 304 라 부담은 거의 없다).
        add_header Cache-Control            "private, no-cache"        always;
        # 확장자와 다른 내용으로 브라우저를 속이는 것을 막는다
        add_header X-Content-Type-Options   "nosniff"                  always;
        # 첨부가 브라우저에서 열리더라도 스크립트·외부 요청은 전부 막는다
        add_header Content-Security-Policy  "default-src 'none'; sandbox" always;
        add_header X-Frame-Options          "DENY"                     always;
        add_header Content-Disposition      $lm_disposition            always;
    }

    # ── 프론트엔드(React 빌드 산출물) ──
    location / {
        proxy_pass         http://frontend:80/;
        proxy_set_header   Host $host;
    }
}
